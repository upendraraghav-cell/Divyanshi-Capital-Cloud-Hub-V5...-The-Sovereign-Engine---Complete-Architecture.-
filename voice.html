<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <style>
        body {
            background: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .console {
            width: 400px;
            padding: 40px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px;
            text-align: center;
            backdrop-filter: blur(20px);
        }
        .orb {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #43a4ff 0%, #2563eb 100%);
            border-radius: 50%;
            margin: 0 auto 30px;
            box-shadow: 0 0 50px rgba(37,99,235,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 50px rgba(37,99,235,0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 80px rgba(37,99,235,0.6); }
            100% { transform: scale(1); box-shadow: 0 0 50px rgba(37,99,235,0.4); }
        }
        h2 { font-weight: 900; text-transform: uppercase; letter-spacing: -1px; font-style: italic; }
        .status { font-size: 10px; font-weight: 900; color: #43a4ff; text-transform: uppercase; letter-spacing: 2px; }
        .input-group { margin-top: 30px; }
        input {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            color: white;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: 15px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover { background: #43a4ff; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="console">
        <div class="orb"></div>
        <div class="status">FreePBX AI Bridge Active</div>
        <h2>Voice Control</h2>
        <div class="input-group">
            <input type="text" id="phone" placeholder="+91 XXXXX XXXXX">
            <button onclick="triggerCall()">Initiate AI Call</button>
        </div>
        <div id="logs" style="margin-top: 20px; font-size: 9px; color: #64748b; font-family: monospace;"></div>
    </div>

    <script>
        function triggerCall() {
            const num = document.getElementById('phone').value;
            if(!num) return alert('Enter Number');
            
            document.getElementById('logs').innerText = "CONNECTING_TO_FREEPBX: " + num + "...";
            
            // Simulation of back-end integration
            google.script.run
                .withSuccessHandler(res => {
                    document.getElementById('logs').innerText = "AI_CALL_INITIATED: Laila Node active.";
                })
                .withFailureHandler(err => {
                    document.getElementById('logs').innerText = "ERROR: Bridge disconnected.";
                })
                .processVoiceCommand(num);
        }
    </script>
</body>
</html>
